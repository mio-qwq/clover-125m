# Example only. Replace domain/cert paths and provision certificates first.
limit_req_zone $binary_remote_addr zone=clover_chat:1m rate=12r/m;
server { listen 80 default_server; server_name _; return 444; }
server { listen 443 ssl default_server; server_name _; ssl_reject_handshake on; return 444; }
server {
    listen 80; server_name chat.example.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/clover-acme; try_files $uri =404; }
    location / { return 308 https://chat.example.org$request_uri; }
}
server {
    listen 443 ssl; server_name chat.example.org;
    ssl_certificate /etc/letsencrypt/live/chat.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off; server_tokens off; client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8766;
    proxy_set_header Origin "";
    proxy_set_header Sec-Fetch-Site "";
    proxy_set_header Connection "";
    proxy_buffering off; proxy_read_timeout 110s;
    location = /api/chat { limit_req zone=clover_chat burst=2 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:8766; }
    location / { proxy_pass http://127.0.0.1:8766; }
}
